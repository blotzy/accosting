<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Ah Ah Ah!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #0f0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .gif-container {
      margin-bottom: 2rem;
      border: 3px solid #0f0;
      padding: 10px;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    .gif-container img {
      width: 100%;
      max-width: 500px;
      height: auto;
      display: block;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #0f0;
      animation: flicker 2s infinite alternate;
    }

    .message {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 5px #0f0;
    }

    .subtitle {
      font-size: 1rem;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    a {
      display: inline-block;
      color: #0f0;
      text-decoration: none;
      border: 2px solid #0f0;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      transition: all 0.3s;
      text-shadow: 0 0 5px #0f0;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
    }

    a:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        transparent 50%,
        rgba(0, 255, 0, 0.05) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      animation: scan 8s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="container">
    <div class="gif-container">
      <img
        src="/assets/you-didnt-say-the-magic-word-ah-ah.gif"
        alt="Ah ah ah, you didn't say the magic word"
      >
    </div>
    <h1>404</h1>
    <!--
    <div class="message">AH AH AH!</div>
    <div class="subtitle">You didn't say the magic word...</div>
  -->
    <div class="subtitle">This page doesn't exist in the system.</div>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
