<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>accosting.us</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      background: #1d1f21;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .terminal {
      background: #282c34;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal-header {
      background: #3c4049;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .terminal-btn.close { background: #ff5f56; }
    .terminal-btn.minimize { background: #ffbd2e; }
    .terminal-btn.maximize { background: #27c93f; }

    .terminal-title {
      flex: 1;
      text-align: center;
      color: #9da5b4;
      font-size: 13px;
      margin-right: 52px;
    }

    .terminal-body {
      padding: 20px;
      color: #abb2bf;
      line-height: 1.7;
    }

    .prompt {
      color: #98c379;
    }

    .command {
      color: #61afef;
    }

    .output {
      margin: 12px 0 20px 0;
      padding-left: 0;
    }

    .name {
      color: #e5c07b;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .link {
      color: #61afef;
      text-decoration: none;
      transition: color 0.2s;
    }

    .link:hover {
      color: #98c379;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #528bff;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 640px) {
      .terminal {
        border-radius: 0;
      }
      .name {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-header">
      <div class="terminal-btn close"></div>
      <div class="terminal-btn minimize"></div>
      <div class="terminal-btn maximize"></div>
      <div class="terminal-title">accosting.us</div>
    </div>
    <div class="terminal-body">
      <div>
        <span class="prompt">$</span> <span class="command">whoami</span>
      </div>
      <div class="output">
        <span class="name">Richard Acosta</span>
      </div>

      <div>
        <span class="prompt">$</span> <span class="command">echo $EMAIL</span>
      </div>
      <div class="output">
        <a href="mailto:hire@accosting.us" class="link">hire@accosting.us</a>
      </div>

      <div>
        <a href="./files/racosta-resume.pdf" target="_blank" class="link"><span class="prompt">$</span> <span class="command">open resume.pdf</span><span class="cursor"></span></a>
      </div>
    </div>
  </div>
</body>
</html>
