<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>accosting.us</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      color: white;
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      animation: fadeInDown 0.8s ease-out;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.2rem;
      margin-bottom: 3rem;
      animation: fadeInDown 0.8s ease-out 0.2s backwards;
    }

    .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      animation: fadeIn 1s ease-out 0.4s backwards;
    }

    .widget {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .widget:hover {
      transform: translateY(-10px) rotate(1deg);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .widget::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .widget:hover::before {
      opacity: 1;
    }

    .widget-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }

    .widget h2 {
      color: #667eea;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .widget p {
      color: #666;
      line-height: 1.6;
    }

    .widget a {
      color: inherit;
      text-decoration: none;
      display: block;
    }

    .widget-link {
      display: inline-block;
      margin-top: 1rem;
      color: #667eea;
      font-weight: bold;
      border-bottom: 2px solid transparent;
      transition: border-color 0.3s ease;
    }

    .widget-link:hover {
      border-color: #667eea;
    }

    .iou-note {
      background: #fff9c4;
      border-left: 4px solid #ffd54f;
      padding: 15px;
      margin-top: 15px;
      font-style: italic;
      color: #666;
      transform: rotate(-1deg);
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
    }

    .contact-email {
      background: #f0f0f0;
      padding: 10px 15px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      color: #333;
      word-break: break-all;
    }

    /* Animation keyframes */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .widget:nth-child(1) { animation-delay: 0.5s; }
    .widget:nth-child(2) { animation-delay: 0.6s; }
    .widget:nth-child(3) { animation-delay: 0.7s; }

    .widget {
      animation: fadeInUp 0.6s ease-out backwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      .subtitle {
        font-size: 1rem;
      }
      .widget-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Richard Acosta</h1>
  <p class="subtitle">Digital playground & portfolio</p>

  <div class="widget-grid">
    <!-- Resume Widget -->
    <div class="widget" onclick="window.open('./files/racosta-resume.pdf', '_blank')">
      <span class="widget-icon">📄</span>
      <h2>Resume</h2>
      <p>Check out my professional experience and skills.</p>
      <span class="widget-link">View PDF →</span>
    </div>

    <!-- Contact Widget -->
    <div class="widget">
      <span class="widget-icon">📧</span>
      <h2>Contact</h2>
      <p>Let's work together!</p>
      <div class="contact-email">hire@accosting.us</div>
    </div>

    <!-- WEEEEEEE Game Widget -->
    <div class="widget" onclick="window.location.href='./weeeeeee/'">
      <span class="widget-icon">✈️</span>
      <h2>WEEEEEEE!</h2>
      <p>WEEEEEEEEEEEEEEE!</p>
      <span class="widget-link">Play Now →</span>
    </div>
  </div>
</body>
</html>
